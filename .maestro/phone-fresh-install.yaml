# The un-granted leg of the real-hardware gate.
#
# 🔴 WHY THIS EXISTS. `phone-smoke.yaml` runs after an `install -r -g`, which grants every runtime
# permission before the app ever starts. That is the right shape for a reachability gate — it
# walks the whole shell without a dialog interrupting — but it means the gate has NEVER seen the
# app a new owner sees. A1 is what that cost: the app's main call to action opened a blank screen
# carrying a raw platform exception (`validateClientPermissionsLocked … cannot open camera "0"
# without camera permission`) because the scanner opened the camera before asking for it. That
# shipped in 2.1.0 and 2.1.1 with every gate green, twice, because no gate ever installed without
# `-g`.
#
# ⛔ So this leg installs with NOTHING granted, and the permission prompts are part of the flow it
# drives rather than something removed before it starts. It is deliberately short: it covers the
# first minute of a new install, which is the window `-g` erases.
#
# ⚠ The system dialog's exact wording is the OEM's, so every assertion on it is a loose regex.
# What is asserted precisely is OUR side: that a system prompt arrived at all before any camera
# was opened, and that declining lands on our own copy rather than on a platform exception.
appId: app.solstone.observer.phone
---
# `clearState` here, unlike the granted leg: this flow is about first-run, and it must start
# from one whether or not the installer left anything behind.
- clearState
# 🔴 `permissions: all: deny` is LOAD-BEARING, not belt-and-braces. Maestro's `launchApp`
# GRANTS runtime permissions by default, which is the same blindness as the granted leg's
# `install -r -g` and would silently defeat this entire flow: the app would already hold
# CAMERA, the scanner would open with no prompt, and the A1 assertion below would fail
# against a product that is behaving correctly. Measured 2026-09-20 on the A36: with the
# default, the device reported CAMERA granted=true after every run and the flow landed on
# the scanner; driven by hand from a genuinely un-granted install, the same tap raises
# "Allow solstone to take pictures and record video?" with CAMERA still granted=false.
- launchApp:
    permissions:
      all: deny

# The welcome card an owner meets. Nothing has been asked for yet.
- extendedWaitUntil:
    visible:
      text: "connect a journal"
    timeout: 20000

# 🔴 The A1 path. Tapping the welcome card's main call to action (welcomeConnectJournal, not the journal mark pill) must reach the system camera prompt —
# not a camera.
- tapOn:
    text: "connect a journal"

- extendedWaitUntil:
    visible:
      text: ".*(take pictures|Camera|camera).*"
    timeout: 15000

# ⛔ And the platform's refusal must never reach the owner as platform words. Declining lands on
# our own sentence and our own way out.
- runFlow:
    when:
      visible:
        text: ".*(Don.t allow|DENY|Deny).*"
    commands:
      - tapOn:
          text: ".*(Don.t allow|DENY|Deny).*"
      - extendedWaitUntil:
          visible:
            text: "open android settings"
          timeout: 15000
      - assertNotVisible:
          text: ".*validateClientPermissions.*"
      - assertNotVisible:
          text: ".*Camera error.*"

# Back out to the shell and prove the deck is still the deck: a declined permission is not a
# broken app, and no source may have been turned on by the asking.
- back
- extendedWaitUntil:
    visible:
      text: "connect a journal"
    timeout: 15000
- assertVisible:
    text: "camera"

# ⛔ The camera source's on/off state is NOT assertable through this instrument, and a bare
# `assertVisible: "off"` here can never pass. The deck's source cards are merged Compose
# semantics nodes: the card exposes `content-desc="camera"` with `text=""`, and the on/off
# word rides `stateDescription`, which `uiautomator dump` does not emit at all — the same
# blindness that produced two false accessibility rows in the 2026-09-19 device catalog.
# Measured 2026-09-20 on the A36: the card visibly reads "off / turn it on any time." while
# the only node in the hierarchy is `content-desc="camera"`.
#
# ✅ What still proves "no source was turned on by the asking" is the screenshot below,
# retained per run in artifacts/hitl/. ⛔ Do not re-add a text assertion on the state word;
# it will fail against a correct product, which is what it did on this flow's first ever
# execution.
- takeScreenshot: artifacts/hitl/fresh-install-deck-after-decline
