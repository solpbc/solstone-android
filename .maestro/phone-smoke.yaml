# Real-hardware human-usability gate for the solstone phone app.
#
# This is the gate that would have stopped solstone-android 0.2.0 from reaching a paid contract
# tester with a screen he physically could not use. It runs against the RELEASE APK — the exact
# artifact `make dist-phone` ships — on the Galaxy A36 (API 36, matching targetSdk 36).
#
# It asserts REACHABILITY, not pixels. Maestro drives the real accessibility tree: if a control is
# hidden behind the status bar, drawn under an app bar, or off-screen with nothing to scroll,
# tapping it fails here — which is exactly what happened to the tester.
#
# RETARGETED 2026-09-01 (VPX Android design pass). It drove the old `ObserverActivity` harness menu
# — "Permissions", "Scan pair QR", "PL status probe". Commit e5acda1 (2026-08-25) moved MAIN/LAUNCHER
# to PhoneShellActivity and did not update this flow, so `launchApp` had been opening the shell and
# asserting on a menu that is no longer reachable from it. The gate had been RED since that commit,
# and because `dist-phone` hard-depends on it with no bypass, no phone build could be distributed at
# all. A gate asserting a screen the owner cannot reach is not a weaker gate, it is a stopped one.
#
# What it walks now is the shell an owner actually opens: every deck tile, the status pane, all five
# shelf panes, and the deepest control on each. Same guarantee, current surface.
appId: app.solstone.observer.phone
---
# No `clearState`. `make hitl-phone` uninstalls and reinstalls with `-g` immediately before
# this runs, so the app is already clean AND holds its runtime permissions; `clearState` would
# revoke them mid-gate and put every source into needs-attention, testing a state the gate is
# not for.
- launchApp

# --- The deck. Both destinations, the journal pill, the status pill. ---
# The deck's sources load asynchronously, so the first assertion waits rather than racing the
# first frame.
- extendedWaitUntil:
    visible: "import"
    timeout: 15000
- assertVisible: "add more"
- assertVisible: "photos and files"
- assertVisible: "sources and devices"
- assertVisible: "connect a journal"
- assertVisible: "not paired"
- takeScreenshot: artifacts/hitl/home

# --- The status pane opens from its pill and can be dismissed. ---
# The pane is a popup anchored under the pill; it had been rendering off the top of the screen,
# over the app bar, which is precisely the class of defect this gate exists to catch.
- tapOn: "not paired"
- assertVisible: "status"
- takeScreenshot: artifacts/hitl/status
- tapOn:
    point: "50%,88%"
- assertVisible: "import"

# --- import: three availability rows, none of them pretending to be tappable. ---
- tapOn: "import"
- assertVisible: "photos"
- assertVisible: "files"
- assertVisible: "recently imported"
- takeScreenshot: artifacts/hitl/import
- pressKey: Back
- assertVisible: "add more"

# --- add more: the not-on-home / already-on-home split, and every row opens a source. ---
- tapOn: "add more"
- assertVisible: "already on home"
- assertVisible: "audio"
- assertVisible: "location"
- assertVisible: "camera"
- takeScreenshot: artifacts/hitl/add-more
- pressKey: Back
- assertVisible: "import"

# --- A source's own view, reached FROM THE DECK, the way an owner reaches it. ---
# This tap is itself an accessibility assertion. A source tile used to publish its source only
# inside a merged state description, with no accessible name and no role, so no text selector
# could see it and this gate had to detour through `add more` to reach a source at all. The tile
# now carries the label as its accessible NAME and the state word as its VALUE (contract § 5.5),
# so tapping `audio` here passing means a screen reader can find the tile too.
- tapOn: "audio"
- assertVisible: "taking it in"
# `give this a tile on home` is the LAST control on the screen, so asserting it proves the whole
# pane is reachable rather than just its top.
- assertVisible: "give this a tile on home"
- takeScreenshot: artifacts/hitl/source-audio
- pressKey: Back
- assertVisible: "add more"

# --- The shelf, and every pane behind it. Four of these five opened a blank screen
#     before this pass; each assertion below names something that pane now actually holds. ---
- tapOn:
    point: "6%,7%"
- assertVisible: "your journal"
- assertVisible: "this device"
- assertVisible: "notifications"
- assertVisible: "help"
- assertVisible: "about solstone"
- assertVisible: "privacy"
- takeScreenshot: artifacts/hitl/shelf

- tapOn: "your journal"
- assertVisible: "connect a journal"
- takeScreenshot: artifacts/hitl/your-journal
- pressKey: Back

- tapOn:
    point: "6%,7%"
- tapOn: "this device"
- assertVisible: "app permissions"
- takeScreenshot: artifacts/hitl/this-device
- pressKey: Back

- tapOn:
    point: "6%,7%"
- tapOn: "notifications"
- assertVisible: "open notification settings"
- takeScreenshot: artifacts/hitl/notifications
- pressKey: Back

- tapOn:
    point: "6%,7%"
- tapOn: "help"
- assertVisible: "support site"
- assertVisible: "email support"
- takeScreenshot: artifacts/hitl/help
- pressKey: Back

- tapOn:
    point: "6%,7%"
- tapOn: "about solstone"
- assertVisible: "version"
- assertVisible: "open source"
- assertVisible: "privacy policy"
- takeScreenshot: artifacts/hitl/about
- tapOn: "licenses"
- assertVisible: "SIL OFL 1.1"
- takeScreenshot: artifacts/hitl/licenses
- pressKey: Back
- pressKey: Back

# --- Back from home exits. It must not trap the owner. ---
- assertVisible: "import"
- pressKey: Back
- assertNotVisible: "sources and devices"
